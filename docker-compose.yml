services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/fieldops?replicaSet=rs0&directConnection=true
      JWT_SECRET: local-dev-only-secret-do-not-use-in-production
      STORAGE_DRIVER: local
      APP_URL: http://localhost:3000
      # File change events don't cross the bind mount on Windows and macOS.
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8
    # A single-node replica set, because job booking uses transactions
    # and standalone MongoDB doesn't support them.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first start, then reports healthy once it is primary.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try { rs.status() } catch (e) {
          rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] }) };
          if (!db.hello().isWritablePrimary) quit(1)
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

volumes:
  mongo-data:
