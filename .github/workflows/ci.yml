name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-only-secret-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache the mongod binary used by tests
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Smoke test against the built app, on main only (section 12).
      - name: Install Playwright's Chromium
        if: github.ref == 'refs/heads/main'
        run: npx playwright install --with-deps chromium
      - name: Playwright smoke test
        if: github.ref == 'refs/heads/main'
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure() && github.ref == 'refs/heads/main'
        with:
          name: playwright-report
          path: playwright-report
