# Render Blueprint: New > Blueprint in the Render dashboard, pick this repo.
# Values marked sync: false are asked for once when the Blueprint is created.
services:
  - type: web
    name: fieldops
    runtime: node
    plan: free
    region: singapore
    # --ignore-scripts skips husky and the mongod download that only the tests need.
    buildCommand: npm ci --include=dev --ignore-scripts && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: STORAGE_DRIVER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
